name: Tests und Windows-Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt-Systembibliotheken installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-randr0 libxcb-render-util0 libxrender1 libxi6
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

  windows-build:
    name: Windows-EXE und Installer
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Tests (Windows)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest
      - name: PyInstaller-Build
        run: |
          python -m PyInstaller --noconfirm --clean `
            --distpath packaging/dist --workpath packaging/build `
            packaging/VintedAutoListingTool.spec
      - name: Build prüfen
        run: |
          if (-not (Test-Path "packaging/dist/VintedAutoListingTool/VintedAutoListingTool.exe")) {
            throw "EXE wurde nicht erzeugt"
          }
      - name: Inno Setup installieren
        run: choco install innosetup --no-progress -y
      - name: Installer bauen
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/installer.iss
      - name: EXE als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: VintedAutoListingTool-exe
          path: packaging/dist/VintedAutoListingTool/
      - name: Installer als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: VintedAutoListingTool-Setup
          path: installer_output/VintedAutoListingTool-Setup.exe
