[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vinted-auto-listing-tool"
version = "2.0.0"
description = "Windows-Desktop-App, die aus Produktfotos fertige Vinted-Anzeigen vorbereitet."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.2",
    "httpx>=0.27",
    "cryptography>=42.0",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.5"]

[project.gui-scripts]
vinted-auto-listing-tool = "vinted_tool.app.main:main"

[project.scripts]
vinted-auto-listing-tool-cli = "vinted_tool.app.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vinted_tool = ["assets/*", "database/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
